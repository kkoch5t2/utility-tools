name: Update popular tools

on:
  workflow_dispatch:
  schedule:
    # Every hour at :15
    - cron: "15 * * * *"
  push:
    branches:
      - main
    paths:
      - "scripts/update-popular-tools.mjs"
      - ".github/workflows/popular-tools.yml"

permissions:
  contents: write

concurrency:
  group: popular-tools
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Fetch Cloudflare Web Analytics ranking
        run: node scripts/update-popular-tools.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      - name: Commit ranking when changed
        run: |
          if git diff --quiet -- src/data/popular-tools.json; then
            echo "Popularity ranking is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/popular-tools.json
          git commit -m "Update popular tools ranking"
          git push
